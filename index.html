<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이시가키 항해도</title>
<meta name="description" content="2026.09.13-17 이시가키 14인 여행 · 일정, 예약 체크리스트, 공금 계산기">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081820" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이시가키">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  /* 해도(nautical chart) 팔레트 — 흰 심해, 얕은 여울의 청록, 육지의 황갈, 항로 표시의 마젠타 */
  --deep:#FFFFFF;
  --sheet:#F2F6F7;
  --shoal:#CFE6EC;
  --shoal-soft:#E6F1F4;
  --land-soft:#F7EFDD;
  --sea:#E6F1F4;
  --isle:#F7EFDD;
  --ink:#0F2028;
  --ink-2:#3B535E;
  --ink-3:#6E838C;
  --rule:#C3D2D6;
  --rule-soft:#DDE6E8;
  --chart:#D10A6E;
  --chart-soft:#FDE8F1;
  --warn:#B45309;
  --warn-soft:#FBEFDC;
  --ok:#12695A;
  --ok-soft:#DDEFEA;
  --card:#FFFFFF;
  --field:#F4F7F8;
  --bar:#FFFFFFEE;
  --shadow:0 1px 3px rgba(15,32,40,.07);
  --lift:0 2px 10px rgba(15,32,40,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --deep:#081820; --sheet:#0B1E27; --shoal:#123A47; --shoal-soft:#0F2E39; --land-soft:#221E13; --sea:#0A2833; --isle:#241F14;
    --ink:#E4EDF0; --ink-2:#A9BEC6; --ink-3:#7A939C;
    --rule:#22434F; --rule-soft:#173039;
    --chart:#FF5CA6; --chart-soft:#33101F;
    --warn:#E9A63F; --warn-soft:#33260F;
    --ok:#5CC9B0; --ok-soft:#0E2E2A;
    --card:#0D2531; --field:#0A2029; --bar:#081820EE;
    --shadow:0 1px 3px rgba(0,0,0,.45); --lift:0 2px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --deep:#081820; --sheet:#0B1E27; --shoal:#123A47; --shoal-soft:#0F2E39; --land-soft:#221E13; --sea:#0A2833; --isle:#241F14;
  --ink:#E4EDF0; --ink-2:#A9BEC6; --ink-3:#7A939C;
  --rule:#22434F; --rule-soft:#173039;
  --chart:#FF5CA6; --chart-soft:#33101F;
  --warn:#E9A63F; --warn-soft:#33260F;
  --ok:#5CC9B0; --ok-soft:#0E2E2A;
  --card:#0D2531; --field:#0A2029; --bar:#081820EE;
  --shadow:0 1px 3px rgba(0,0,0,.45); --lift:0 2px 10px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sheet);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--chart);outline-offset:2px}
button{font:inherit;color:inherit}

/* ═══ 앱 셸 ═══ */
.appbar{
  flex:0 0 auto;background:var(--bar);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--rule-soft);
  padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:"Gowun Batang",serif;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  background:var(--chart);color:#fff;padding:5px 11px;border-radius:100px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.chip.live{background:var(--ok)}

.views{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.view{padding:20px 20px 32px;max-width:640px;margin:0 auto}

.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--bar);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--rule-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  background:none;border:0;padding:9px 2px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;letter-spacing:-.01em;
  border-top:2px solid transparent;margin-top:-1px;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--chart);border-top-color:var(--chart);font-weight:600}
.tab .dot{position:absolute;transform:translate(13px,-3px);width:7px;height:7px;
  border-radius:50%;background:var(--chart);border:1.5px solid var(--bar)}

/* ═══ 공통 ═══ */
.vhead{margin-bottom:16px}
.vhead h2{font-family:"Gowun Batang",serif;font-size:23px;font-weight:700;line-height:1.28}
.vhead p{color:var(--ink-2);font-size:13.5px;margin-top:6px}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.card-h h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.08em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.sec-label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}
.sec-label:first-child{margin-top:0}

/* ═══ 오늘 ═══ */
.hero{background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--lift);
  margin-bottom:14px;border-top:3px solid var(--chart)}
.hero .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.hero .big{font-family:"Gowun Batang",serif;font-size:clamp(30px,9vw,40px);
  font-weight:700;line-height:1.1;margin:8px 0 6px;letter-spacing:-.02em}
.hero .cnt{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;
  line-height:1;color:var(--chart);font-variant-numeric:tabular-nums}
.hero p{color:var(--ink-2);font-size:13.5px;margin-top:10px}
.hero-meta{display:flex;gap:0 22px;flex-wrap:wrap;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--rule-soft);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.hero-meta b{color:var(--ink);font-weight:600}

.mini{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule-soft);align-items:flex-start}
.mini:last-child{border-bottom:0;padding-bottom:0}
.mini-t{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);
  min-width:42px;padding-top:2px;font-variant-numeric:tabular-nums}
.mini-b{flex:1;min-width:0;font-size:14px}
.mini-b strong{font-weight:600}
.mini-b small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.55;margin-top:2px}
.mini.key .mini-t{color:var(--chart);font-weight:600}

.jump{display:block;width:100%;text-align:left;background:var(--shoal-soft);
  border:0;border-radius:10px;padding:14px 16px;cursor:pointer;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.jump:hover{background:var(--shoal)}
a.jump{text-decoration:none;color:inherit}
a.jump.review{background:var(--chart-soft);border:1px solid var(--chart)}
a.jump.review:hover{background:var(--chart);color:#fff}
a.jump.review:hover small,a.jump.review:hover .arw{color:#fff}
.jump b{font-size:14.5px;font-weight:600;display:block}
.jump small{color:var(--ink-2);font-size:12.5px}
.jump .arw{font-family:"IBM Plex Mono",monospace;color:var(--chart);font-size:16px;flex:0 0 auto}

/* ═══ 날씨 ═══ */
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule-soft);
  border-radius:9px;overflow:hidden;border:1px solid var(--rule-soft)}
.wx-day{background:var(--card);padding:11px 6px;display:flex;flex-direction:column;
  gap:4px;align-items:center}
.wx-day.best{background:var(--shoal-soft)}
.wx-day.now{background:var(--chart-soft)}
.wx-d{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wx-i{font-size:18px;line-height:1}
.wx-t{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.wx-p{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wx-p.hi{color:var(--chart);font-weight:600}
.note{font-size:13px;color:var(--ink-2);margin-top:14px;padding-left:12px;
  border-left:2px solid var(--chart)}
.note b{color:var(--ink)}
.src{font-size:11.5px;color:var(--ink-3);margin-top:9px;
  font-family:"IBM Plex Mono",monospace}
button.stamp{background:none;border:0;padding:4px 0 4px 8px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.08em}
button.stamp:hover{color:var(--chart)}

/* ═══ 일정 ═══ */
.dayseg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;
  position:sticky;top:0;z-index:2;background:var(--sheet);padding:2px 0 10px}
.dseg{background:var(--card);border:1px solid var(--rule-soft);border-radius:9px;
  padding:9px 2px;cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center}
.dseg b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.dseg span{font-size:10px;color:var(--ink-3)}
.dseg[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--deep)}
.dseg[aria-selected="true"] span{color:var(--deep);opacity:.75}
.dseg.today{border-color:var(--chart)}
.day-title{font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;line-height:1.3}
.day-sub{color:var(--ink-2);font-size:13.5px;margin-top:6px}
.meal{display:flex;gap:12px;background:var(--land-soft);padding:12px 14px;
  border-radius:9px;font-size:13.5px;align-items:flex-start;margin-top:10px}
.meal .m{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  color:var(--ink-3);min-width:32px;padding-top:3px;text-transform:uppercase}
.meal small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}

/* ═══ 설치 안내 ═══ */
.install{background:var(--shoal-soft);border:1px solid var(--shoal);border-radius:12px;
  padding:16px 18px;margin-bottom:14px;position:relative}
.install h3{font-size:15px;font-weight:600;padding-right:24px;letter-spacing:-.01em}
.install p{font-size:13px;color:var(--ink-2);margin-top:6px}
.install ol{margin:10px 0 0;padding-left:0;list-style:none;counter-reset:st;
  display:flex;flex-direction:column;gap:7px}
.install li{counter-increment:st;position:relative;padding-left:26px;font-size:13.5px}
.install li::before{content:counter(st);position:absolute;left:0;top:1px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--chart);
  border:1px solid var(--chart);width:18px;height:18px;line-height:16px;
  text-align:center;border-radius:50%}
.install li b{font-weight:600}
.install .ic{display:inline-flex;vertical-align:-3px;margin:0 1px}
.install .ic svg{width:15px;height:15px;stroke:var(--chart);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.install .why{margin-top:11px;padding-top:11px;border-top:1px solid var(--shoal);
  font-size:12.5px;color:var(--ink-2)}
.install .why b{color:var(--ink);font-weight:600}
.xclose{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;
  background:none;cursor:pointer;color:var(--ink-3);font-size:19px;line-height:1;
  border-radius:50%;display:flex;align-items:center;justify-content:center}
.xclose:hover{background:var(--shoal);color:var(--ink)}
.btn-install{margin-top:12px}

/* ═══ 지도 ═══ */
.mapcard{padding-bottom:14px}
.map{display:block;width:100%;height:auto;border-radius:9px;margin-top:2px}
.map a{cursor:pointer}
.map a circle[fill="var(--chart)"]{transition:r .12s}
.map a:hover circle[fill="var(--chart)"]{r:9}
.map a:focus-visible{outline:2px solid var(--chart);outline-offset:2px}
.maplegend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.maplegend span{display:flex;align-items:center;gap:5px}
.maplegend i.ln{display:block;width:16px;height:0;border-top:2px solid var(--chart)}
.maplegend i.ln.dash{border-top-style:dashed}
.maplegend .mapnote{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px;
  color:var(--ink-2);flex:1 1 100%;line-height:1.5}
a.geo{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:14px;
  color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
a.geo svg{width:14px;height:14px;flex:0 0 auto;stroke:var(--chart);fill:none;
  stroke-width:1.7;stroke-linejoin:round}
a.geo:hover{color:var(--chart);border-bottom-color:var(--chart)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══ 할일 ═══ */
.prog{margin-bottom:16px}
.prog-l{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.prog-t{height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.prog-f{height:100%;background:var(--ok);width:0;transition:width .3s}
.task{display:flex;gap:13px;align-items:flex-start}
.box{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:1.5px solid var(--rule);
  border-radius:7px;background:var(--field);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;color:transparent;
  font-size:15px;line-height:1;transition:background .15s,border-color .15s}
.box:hover{border-color:var(--chart)}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.t-body{flex:1;min-width:0}
.t-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.t-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.t-tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap;
  background:var(--chart-soft);color:var(--chart)}
.calls{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--ink);color:var(--deep);border:0;border-radius:100px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.btn:hover{background:var(--chart);color:#fff}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--rule);
  font-family:"IBM Plex Sans KR",sans-serif;font-weight:500;font-size:13px}
.btn.ghost:hover{border-color:var(--chart);color:var(--chart);background:var(--field)}
.t-why{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.done-by{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ok);margin-top:9px}
.task.is-done .t-name{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.task.is-done .t-tag{background:var(--ok-soft);color:var(--ok)}
.script{margin-top:11px;background:var(--shoal-soft);border-radius:9px;padding:13px 15px;
  font-size:13px;line-height:1.7}
.script .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:7px}
.script .ko{color:var(--ink-3);font-size:12.5px;display:block;margin-top:6px}

/* ═══ 예산 ═══ */
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ifield label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.ifield label small{display:block;color:var(--ink-3);font-size:11px;line-height:1.45;font-weight:400}
.irow{display:flex;align-items:center;gap:6px}
.irow input{width:100%;min-width:0;background:var(--field);color:var(--ink);
  border:1px solid var(--rule);border-radius:9px;padding:10px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:right}
.irow input:focus{border-color:var(--chart);background:var(--card)}
.unit{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.verdict{border-radius:12px;padding:20px;margin-bottom:14px;
  background:var(--warn-soft);border:1px solid var(--warn)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict .lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.verdict .amt{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;
  line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.verdict .per{font-size:14px;font-weight:600}
.verdict p{font-size:13px;color:var(--ink-2);margin-top:9px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .bl{display:flex;justify-content:space-between;margin-bottom:5px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar-row .bl span:first-child{font-family:"IBM Plex Sans KR",sans-serif;font-size:13px}
.track{height:22px;background:var(--rule-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;transition:width .3s}
.fill.have{background:var(--shoal)}
.fill.need{background:var(--chart)}
.scale{display:flex;justify-content:space-between;margin-top:7px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  padding:0 10px 8px 0;border-bottom:1px solid var(--ink)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
td.r,th.r{text-align:right;padding-right:0;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.45}
tr.var td{background:var(--shoal-soft)}
tr.sum td{border-top:1px solid var(--ink);border-bottom:0;font-weight:600;padding-top:11px}
tr.gapr td{border:0;font-weight:600;color:var(--chart)}

var WX_FALLBACK = [
  ["9/13 일","🌦️","32 / 27","50%",1,0],
  ["9/14 월","☀️","31 / 27","20%",0,1],

];
var WX = WX_FALLBACK;
var wxAt = 0;          /* 예보를 마지막으로 받아온 시각 */
var wxLive = false;

/* 세계기상기구(WMO) 날씨 코드 → 아이콘 */
function wmo(c){
  if (c === 0) return "☀️";
  if (c === 1) return "🌤️";
  if (c === 2) return "⛅";
  if (c === 3) return "☁️";
  if (c === 45 || c === 48) return "🌫️";
  if (c >= 51 && c <= 57) return "🌦️";
  if (c >= 61 && c <= 65) return "🌧️";
  if (c >= 80 && c <= 82) return "🌦️";
  if (c >= 95) return "⛈️";
  return "☁️";
}

/* Open-Meteo — 무료, API 키 없음, 브라우저에서 바로 호출됩니다.
   실패하면 아무것도 하지 않습니다. 화면엔 이미 기본값이 그려져 있습니다. */
function fetchWx(force){
  if (!force && Date.now() - wxAt < 3600000) return;   /* 한 시간에 한 번이면 충분 */
  if (afterTrip) return;
  var u = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=24.3448&longitude=124.1572" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=Asia%2FTokyo&start_date=" + TRIP[0] + "&end_date=" + TRIP[4];

  fetch(u).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    var d = j && j.daily;
    if (!d || !d.time || d.time.length !== 5) return;
    WX = d.time.map(function(iso, i){
      var base = WX_FALLBACK[i];
      var pop = d.precipitation_probability_max[i];
      var hi = Math.round(d.temperature_2m_max[i]);
      var lo = Math.round(d.temperature_2m_min[i]);
      return [
        base[0],
        wmo(d.weather_code[i]),
        (isFinite(hi) ? hi : "–") + " / " + (isFinite(lo) ? lo : "–"),
        (pop == null ? "–" : pop + "%"),
        (pop != null && pop >= 50) ? 1 : 0,
        base[5]
      ];
    });
    wxAt = Date.now();
    wxLive = true;
    save("isg-wx", { at: wxAt, days: WX });
    if (current === "today") renderToday();
  }).catch(function(){});
}

  /* 검수에서 채택한 안의 비용을 얹습니다 */

  var yak = facts.yak * PAX, fer = facts.fer * PAX, car = facts.car;
  var need = fixedSum + yak + fer + car;
  var have = FUND_KRW / facts.fx;
  var gap  = need - have, over = gap > 0;
  var perKRW = Math.abs(gap) * facts.fx / PAX;
  var scale = Math.max(Math.ceil(Math.max(need,have)/100000)*100000, 100000);

  var rows = "";
  rows += '<tr class="var"><td>야키니쿠 9/14<small>1인 ' + facts.yak.toLocaleString("en-US") + '엔 × 14</small></td><td class="r">' + yak.toLocaleString("en-US") + '</td></tr>';
  rows += '<tr class="var"><td>다케토미 페리<small>왕복 1인 ' + facts.fer.toLocaleString("en-US") + '엔 × 14</small></td><td class="r">' + fer.toLocaleString("en-US") + '</td></tr>';

  items.forEach(function(r){
    rows += '<tr><td>' + r[0] + '<small>' + r[2] + '</small></td><td class="r">' + r[1].toLocaleString("en-US") + '</td></tr>';
  });
  rows += '<tr class="sum"><td>필요액</td><td class="r">' + yen(need) + '</td></tr>';
  rows += '<tr><td>가용 공금<small>' + won(FUND_KRW) + ' ÷ ' + facts.fx + '</small></td><td class="r">−' + Math.round(have).toLocaleString("en-US") + '</td></tr>';
  rows += '<tr class="gapr"><td>' + (over ? "부족" : "여유") + '</td><td class="r">' + yen(Math.abs(gap)) + '</td></tr>';

  var h = '<div class="vhead"><h2>공금 계산기</h2>' +
    '<p>전화로 확인한 숫자를 넣으면 부족액이 바로 다시 계산됩니다.</p></div>' +
    '<div class="card"><div class="inputs">' +
      fld("f-yak","야키니쿠 1인 단가","기타우치 목장 · 9/14",facts.yak,100,"엔") +
      fld("f-fer","페리 왕복 요금","다케토미 · 1인",facts.fer,10,"엔") +
      fld("f-car","렌터카","공금에서 나가면 금액",facts.car,1000,"엔") +

var VIEWS = ["today","plan","food","todo","money","info"];
var RENDER = { today:renderToday, plan:renderPlan, food:renderFood, todo:renderTodo, money:renderMoney, info:renderInfo };
var current = "today";

function show(name){
  if (VIEWS.indexOf(name) < 0) return;
  current = name;
  VIEWS.forEach(function(v){ $("v-" + v).hidden = (v !== name); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.setAttribute("aria-selected", String(b.getAttribute("data-v") === name));
  });
  RENDER[name]();
  $("views").scrollTop = 0;
}

$("tabbar").addEventListener("click", function(e){
  var b = e.target.closest(".tab");
  if (b) show(b.getAttribute("data-v"));
});

/* ─── 화면 안 상호작용 ─── */
$("views").addEventListener("click", function(e){
  if (e.target.closest("[data-hide=install]")) {
    hidInstall = true;
    try { localStorage.setItem("isg-hide-install", "1"); } catch(err){}
    renderToday();
    return;
  }
  if (e.target.closest("[data-install]")) {
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.then(function(){ installEvt = null; renderToday(); });
    return;
  }
  if (e.target.closest("[data-refresh=wx]")) { fetchWx(true); return; }

  var jump = e.target.closest("[data-go]");
  if (jump) { show(jump.getAttribute("data-go")); return; }

  var seg = e.target.closest(".dseg");
  if (seg) { pickedDay = +seg.getAttribute("data-day"); renderPlan(); return; }

  var box = e.target.closest(".box");
  if (box) {
    var id = box.closest(".task").getAttribute("data-id");
    if (checks[id] && checks[id].done) delete checks[id];
    else checks[id] = { done:true, by:me, at:Date.now() };
    save("isg-checks", checks);
    renderTodo();
  }
});

$("views").addEventListener("input", function(e){
  var t = e.target;
  if (t.id === "who") {
    me = t.value.trim();
    try { localStorage.setItem("isg-name", me); } catch(err){}
    return;
  }
  var map = { "f-yak":"yak", "f-fer":"fer", "f-car":"car", "f-fx":"fx" };
  var k = map[t.id];
  if (!k) return;
  var v = parseFloat(t.value);
  if (!isFinite(v) || v < 0 || (k === "fx" && v < 1)) return;
  facts[k] = v;
  save("isg-facts", facts);
  /* 입력 중 포커스를 잃지 않도록, 다시 그리지 않고 필요한 곳만 갱신합니다 */
  var keep = t.id, pos = t.selectionStart;
  renderMoney();
  var again = $(keep);
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(err){} }
});

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  installEvt = e;
  if (current === "today") renderToday();
});
window.addEventListener("appinstalled", function(){
  installed = true;
  if (current === "today") renderToday();
});

if (tripIdx >= 0) { pickedDay = tripIdx; $("chip").textContent = "DAY " + (tripIdx+1); $("chip").className = "chip live"; }
else if (afterTrip) { $("chip").textContent = "종료"; $("chip").className = "chip live"; }
else { $("chip").textContent = "D-" + daysLeft; }
show("today");
fetchWx(false);

/* 앱으로 돌아올 때 한 번씩 다시 확인합니다 */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) fetchWx(false);
});

})();
