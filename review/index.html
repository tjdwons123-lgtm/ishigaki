<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DDIP 검수</title>
<meta name="description" content="새로 제안된 일정안을 검토하고 채택하면 메인 앱에 반영됩니다">
<meta name="theme-color" content="#7FE0D8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E7F7A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --deep:#FFFFFF; --sheet:#FFF8EE; --shoal:#A9E6E1; --shoal-soft:#E0F6F3;
  --lagoon:#3FC2BA;
  --ink:#2C4A52; --ink-2:#557179; --ink-3:#8AA3A9;
  --rule:#D6E4E2; --rule-soft:#EAF2F0;
  --chart:#E0457E; --chart-soft:#FDE6EF;
  --warn:#C2621F; --warn-soft:#FDEEDF;
  --ok:#12897A; --ok-soft:#DBF2EE;
  --card:#FFFFFF; --field:#F5FAF9; --bar:#FFFDF9F2;
  --shadow:0 2px 8px rgba(44,74,82,.07);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0B1F26; --sheet:#0E2229; --shoal:#1D5C5A; --shoal-soft:#123A3B; --lagoon:#4FD3C9;
  --ink:#E6F2F0; --ink-2:#AFC8C7; --ink-3:#7D9B9C;
  --rule:#254449; --rule-soft:#173236;
  --chart:#FF7FB0; --chart-soft:#3A1223;
  --warn:#EFA059; --warn-soft:#33240F;
  --ok:#57D2BE; --ok-soft:#0E332E;
  --card:#132D34; --field:#102830; --bar:#0E2229F2;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --deep:#0B1F26; --sheet:#0E2229; --shoal:#1D5C5A; --shoal-soft:#123A3B; --lagoon:#4FD3C9;
  --ink:#E6F2F0; --ink-2:#AFC8C7; --ink-3:#7D9B9C;
  --rule:#254449; --rule-soft:#173236; --chart:#FF7FB0; --chart-soft:#3A1223;
  --warn:#EFA059; --warn-soft:#33240F; --ok:#57D2BE; --ok-soft:#0E332E;
  --card:#132D34; --field:#102830; --bar:#0E2229F2;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sheet);
  background-image:radial-gradient(circle at 1px 1px, rgba(63,194,186,.10) 1px, transparent 0);background-size:22px 22px;color:var(--ink);line-height:1.65;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chart);outline-offset:2px}

.appbar{flex:0 0 auto;background:linear-gradient(180deg,#7FE0D8,#3FC2BA);color:#083B3F;
  border-bottom:0;
  padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit;
  font-size:14px;font-weight:500}
.back span.a{font-family:"IBM Plex Mono",monospace;color:inherit;font-size:16px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  background:#fff;color:var(--chart);padding:5px 11px;border-radius:100px;white-space:nowrap}
.count.some{color:var(--ok)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto;padding:22px 20px calc(env(safe-area-inset-bottom) + 40px)}

.lede h1{font-family:"Jua",sans-serif;font-size:26px;font-weight:700;line-height:1.3}
.lede p{color:var(--ink-2);font-size:14px;margin-top:8px}
.howto{background:var(--shoal-soft);border-radius:14px;padding:14px 16px;margin:16px 0 26px;
  font-size:13px;color:var(--ink-2)}
.howto b{color:var(--ink)}

.grp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:30px 0 10px}
.p{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;
  overflow:hidden;border:1px solid transparent}
.p.on{border-color:var(--ok)}
.p-head{padding:18px 18px 0}
.p-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.p-title{font-size:16.5px;font-weight:600;letter-spacing:-.01em;flex:1}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap;
  background:var(--chart-soft);color:var(--chart)}
.tag.rec{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.p-sum{font-size:13.5px;color:var(--ink-2);margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:0 20px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--rule-soft);font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:600}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:14px}
.pros h4{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pros ul{margin:0;padding-left:15px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.pros .con ul{color:var(--ink-2)}
.pros li::marker{color:var(--ink-3)}
.p-why{font-size:12.5px;color:var(--ink-2);margin-top:14px;padding:11px 13px;
  background:var(--field);border-radius:8px;line-height:1.65}
.p-why b{color:var(--ink)}
.p-act{display:flex;gap:8px;padding:16px 18px 18px;margin-top:4px}
.act{flex:1;border:1px solid var(--rule);background:var(--field);border-radius:100px;
  padding:11px 8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.act:hover{border-color:var(--chart);color:var(--chart)}
.act[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.act.no[aria-pressed="true"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--deep)}
.exc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--warn);
  padding:0 18px 14px;margin-top:-6px}

.summary{background:var(--card);border-radius:18px;box-shadow:var(--shadow);
  padding:18px;margin-top:30px}
.summary h3{font-size:16px;font-weight:600;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.srow:last-of-type{border-bottom:0}
.srow .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow.tot{border-top:1px solid var(--ink);border-bottom:0;font-weight:600;padding-top:12px;margin-top:4px}
.srow.gap{color:var(--chart);font-weight:600;border:0;padding-top:2px}
.empty{font-size:13px;color:var(--ink-3);padding:6px 0}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;margin-top:16px;background:var(--ink);color:var(--deep);border:0;
  border-radius:14px;padding:15px 18px;cursor:pointer;text-decoration:none}
.go b{font-size:14.5px}
.go small{display:block;opacity:.7;font-size:12px;font-weight:400}
.go .a{font-family:"IBM Plex Mono",monospace;font-size:16px}
.foot{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  text-align:center;margin-top:26px;letter-spacing:.06em;line-height:1.8}
@media (max-width:420px){.pros{grid-template-columns:1fr;gap:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="appbar">
  <a class="back" href="../"><span class="a">←</span> DDIP 이시가키 일지</a>
  <span class="count" id="count">0건 채택</span>
</div>

<div class="scroll">
  <div class="wrap">
    <div class="lede">
      <h1>검수</h1>
      <p>새로 조사한 안들입니다. <b>채택한 것만</b> 메인 앱의 일정·지도·예산에 들어갑니다.</p>
    </div>
    <div class="howto">
      고르면 이 기기에 바로 저장되고, <b>뒤로 가면 반영돼 있습니다.</b> 언제든 다시 바꿀 수 있습니다.
      다만 저장은 이 폰 안에서만 되니, 최종 결정은 단톡방에 알려주세요.
    </div>
    <div id="list"></div>
    <div class="summary" id="summary"></div>
    <p class="foot">2026.09.13 – 09.17 · 14 PAX<br>조사일 2026-09-06</p>
  </div>
</div>

<script>
(function(){
"use strict";

var PAX = 14;

var PROPOSALS = [
  {
    group: "1 · 만타 비용을 어떻게 낼 것인가",
    id: "manta-private",
    title: "만타는 희망자만 · 개인 부담",
    tag: "추천", tagClass: "rec",
    sum: "9/14 만타는 일정에 확정됐습니다. 남은 결정은 돈입니다 — 공금으로 낼지, 타는 사람이 낼지.",
    facts: [["전세 14명", "¥105,000 = 공금"], ["개별 참가", "1인 ¥9,500"],
            ["공금 부족액", "개인부담이면 ¥93,191"], ["공금으로 내면", "¥198,191"]],
    pro: ["<b>공금 부족액이 절반으로 줄어듭니다</b> — 1인 13만원 → 6만원",
          "만타에 관심 없는 사람이 남의 배값을 안 냅니다",
          "멀미가 있는 사람은 빠지고 서쪽 해안에서 합류하면 됩니다",
          "인원이 적으면 전세보다 개별이 쌉니다 (7명이면 ¥66,500)"],
    con: ["갈라지는 시간이 생깁니다 — 오전 3시간 반",
          "안 가는 사람은 오전에 할 일이 필요합니다",
          "8명 이상이면 전세가 오히려 쌉니다"],
    why: "<b>지금 공금이 19.8만엔 모자랍니다.</b> 1인 13만원을 더 걷어야 하는데, 만타를 개인 부담으로 돌리면 6만원으로 줄어듭니다. 만타는 관심도가 갈리는 유일한 활동이라 여기가 가장 자연스러운 절단면입니다.",
    cost: { add: 0, remove: 105000, label: "만타 전세를 공금에서 제외" }
  },
  {
    group: "2 · 원숭이",
    id: "monkey",
    title: "이시가키 야이마무라 — 리스자루노모리",
    tag: "확인 필요", tagClass: "warn",
    sum: "2일차 오후 갈래 중 하나. 다람쥐원숭이가 반방사 상태로 있어 어깨나 손에 올라옵니다.",
    facts: [["위치", "나구라만 서쪽 · 시내에서 15분"], ["시간", "09:00~17:30 · 무휴"],
            ["비용", "입촌료 ¥1,080~ · 14명 ¥15,120"], ["전화", "0980-82-8798"]],
    pro: ["2일차 오후가 원래 비어 있어 전원 일정을 안 건드립니다",
          "만타 갈래와 나란히 둘 수 있습니다 — 관심대로 갈리면 됩니다",
          "류큐 전통가옥과 나구라만 전망도 같이 봅니다",
          "비 오는 날 대안으로도 씁니다"],
    con: ["<b>2026년 7월 20일부터 먹이주기 체험이 중단됐습니다</b>",
          "야생이 아니라 테마파크 안의 사육 시설입니다",
          "마을 체험 프로그램은 15:00에 끝납니다",
          "입촌료가 1,080엔 '~'이라 실제 금액 확인이 필요합니다"],
    why: "<b>이시가키에 야생 원숭이는 없습니다.</b> 섬에서 원숭이를 볼 수 있는 곳은 여기 하나뿐입니다. 먹이주기가 중단돼 기대치를 낮춰야 하지만, 원숭이가 사람 어깨에 올라오는 것 자체는 여전합니다. 예약 전에 전화로 입촌료와 먹이주기 재개 여부를 확인하세요.",
    cost: { add: 15120, remove: 0, label: "야이마무라 입촌료 14명" }
  },
  {
    group: "3 · 조 편성",
    id: "teams",
    title: "기본은 다 같이, 정해둔 지점에서만 갈래",
    tag: "추천", tagClass: "rec",
    sum: "차 조는 이동할 때만 쓰는 7+7이고, 갈라지는 건 표에 적힌 세 지점뿐입니다. 역할·금주 당번·갈라질 때 규칙까지 정합니다.",
    facts: [["차량", "8인승 2대 · 7명씩 · 여유 1석"], ["역할", "총괄 · 차장 · 운전 2 · 총무"],
            ["갈래", "9/14 오후 · 9/16 두 지점"], ["IDP", "4명 필요"]],
    pro: ["<b>조를 미리 고정하지 않습니다</b> — 하루 종일 따로 노는 여행이 안 됩니다",
          "차 조는 이동 단위일 뿐, 도착하면 다시 한 덩어리입니다",
          "페리 예약이 한 건에 10명까지라 7+7이 그대로 맞습니다",
          "금주 당번을 나누면 각자 하루만 술을 안 마십니다"],
    con: ["갈래마다 운전자가 있어야 해서 IDP 4명이 전제입니다",
          "갈라질 때 집합 시각을 안 정하면 한 시간이 날아갑니다",
          "총무 한 명에게 정산이 몰립니다"],
    why: "<b>차 1대가 갈래의 최소 단위입니다.</b> 3명만 따로 가면 차가 모자라니, 갈래는 최대 둘까지. 송영이 되는 투어를 고르면 그 갈래는 차를 안 써서 2대가 남는 사람들에게 그대로 남습니다. 채택하면 정보 탭에 갈래 지점표와 금주 당번표가 생깁니다.",
    cost: null
  }
];

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
var yen = function(n){ return (n < 0 ? "−¥" : "+¥") + Math.abs(Math.round(n)).toLocaleString("en-US"); };

var adopted = {};
try { adopted = JSON.parse(localStorage.getItem("isg-adopted") || "{}"); } catch(e){}

function save(){
  try { localStorage.setItem("isg-adopted", JSON.stringify(adopted)); } catch(e){}
}

function render(){
  var lastGroup = "", h = "";
  PROPOSALS.forEach(function(p){
    if (p.group !== lastGroup) { h += '<div class="grp">' + esc(p.group) + '</div>'; lastGroup = p.group; }
    var on = !!adopted[p.id];
    h += '<div class="p' + (on ? " on" : "") + '"><div class="p-head"><div class="p-top">' +
      '<span class="p-title">' + esc(p.title) + '</span>' +
      '<span class="tag ' + p.tagClass + '">' + esc(p.tag) + '</span></div>' +
      '<p class="p-sum">' + esc(p.sum) + '</p>';

    h += '<div class="facts">' + p.facts.map(function(f){
      return '<span>' + esc(f[0]) + ' <b>' + esc(f[1]) + '</b></span>';
    }).join("") + '</div>';

    h += '<div class="pros"><div><h4>좋은 점</h4><ul>' +
      p.pro.map(function(x){ return "<li>" + x + "</li>"; }).join("") + '</ul></div>' +
      '<div class="con"><h4>걸리는 점</h4><ul>' +
      p.con.map(function(x){ return "<li>" + x + "</li>"; }).join("") + '</ul></div></div>';

    h += '<p class="p-why">' + p.why + '</p></div>';

    h += '<div class="p-act">' +
      '<button class="act yes" type="button" data-id="' + p.id + '" data-v="1" aria-pressed="' + on + '">채택</button>' +
      '<button class="act no" type="button" data-id="' + p.id + '" data-v="0" aria-pressed="' + (!on) + '">보류</button>' +
      '</div>';

    if (p.excludes && p.excludes.some(function(x){ return adopted[x]; })) {
      h += '<p class="exc">↑ 위 안과 함께 쓸 수 없어 자동으로 해제됩니다</p>';
    }
    h += '</div>';
  });
  $("list").innerHTML = h;

  /* 요약 */
  var picked = PROPOSALS.filter(function(p){ return adopted[p.id]; });
  var s = '<h3>채택한 안</h3>';
  if (!picked.length) {
    s += '<p class="empty">아직 고른 게 없습니다. 채택하지 않으면 메인 앱은 지금 일정 그대로입니다.</p>';
  } else {
    var delta = 0;
    picked.forEach(function(p){
      var d = p.cost ? (p.cost.add - p.cost.remove) : 0;
      delta += d;
      s += '<div class="srow"><span>' + esc(p.title) + '</span><span class="v">' +
           (p.cost ? yen(d) : "비용 없음") + '</span></div>';
    });
    s += '<div class="srow tot"><span>예산 변동</span><span class="v">' + yen(delta) + '</span></div>';
    s += '<div class="srow gap"><span>1인당</span><span class="v">' +
         yen(delta / PAX) + '</span></div>';
  }
  s += '<a class="go" href="../"><span><b>메인 앱으로 돌아가기</b>' +
       '<small>일정 · 지도 · 예산에 바로 반영됩니다</small></span><span class="a">→</span></a>';
  $("summary").innerHTML = s;

  var n = picked.length;
  $("count").textContent = n + "건 채택";
  $("count").className = "count" + (n ? " some" : "");
}

$("list").addEventListener("click", function(e){
  var b = e.target.closest(".act");
  if (!b) return;
  var id = b.getAttribute("data-id");
  var yes = b.getAttribute("data-v") === "1";
  adopted[id] = yes;
  if (yes) {
    /* 서로 배타적인 안은 하나만 남깁니다 */
    var p = PROPOSALS.filter(function(x){ return x.id === id; })[0];
    if (p && p.excludes) p.excludes.forEach(function(x){ adopted[x] = false; });
  }
  save();
  render();
});

render();

})();
</script>
</body>
</html>
